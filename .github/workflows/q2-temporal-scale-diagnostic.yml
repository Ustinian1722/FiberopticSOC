name: Q2 temporal-scale diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/q2-temporal-scale-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Stage data
        run: |
          mkdir -p data/extracted/SiC-18
          echo "8ebc43eb6d205dfc573dae853d63efcd1a00169be9d2f1e512b9220ea7799bc4  SiC-18.zip" | sha256sum -c -
          unzip -q SiC-18.zip -d data/extracted/SiC-18
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.2 openpyxl==3.1.5 scikit-learn==1.8.0
      - name: Run temporal-scale analysis
        run: |
          python analysis/run_q2_temporal_scale_diagnostic.py \
            --data data/extracted/SiC-18 \
            --out-dir results/q2_temporal_scale
      - uses: actions/upload-artifact@v4
        with:
          name: q2-temporal-scale
          path: results/q2_temporal_scale/**
          retention-days: 30
