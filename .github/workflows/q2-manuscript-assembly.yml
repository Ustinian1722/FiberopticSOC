# canonical-v2-final
name: Q2 English manuscript assembly

on:
  workflow_dispatch:
  push:
    branches: [research/eo-gated-mamba-paper]
    paths:
      - "docs/Q2_ENGLISH_FRONT_INTRO_V2.md"
      - "docs/Q2_ABSTRACT_EN_FINAL.md"
      - "docs/Q2_ENGLISH_SECTIONS2_3_V2.md"
      - "docs/Q2_ENGLISH_SECTIONS4_6_V2.md"
      - "docs/Q2_MAIN_FIGURE_CAPTIONS_EN.md"
      - "docs/Q2_REFERENCES_EN_CORE.md"
      - "analysis/assemble_q2_english_manuscript.py"
      - ".github/workflows/q2-manuscript-assembly.yml"

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/eo-gated-mamba-paper
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Assemble and lint manuscript V2
        run: python analysis/assemble_q2_english_manuscript.py
      - name: Verify manuscript V2 contract
        run: |
          test -s paper/manuscript/Q2_ENGLISH_MANUSCRIPT_V2.md
          test -s paper/manuscript/Q2_ENGLISH_MANUSCRIPT_V2_ASSEMBLY_REPORT.md
          grep -F '# 6. Conclusion' paper/manuscript/Q2_ENGLISH_MANUSCRIPT_V2.md
          grep -F '# Data availability' paper/manuscript/Q2_ENGLISH_MANUSCRIPT_V2.md
          grep -F '# Code availability' paper/manuscript/Q2_ENGLISH_MANUSCRIPT_V2.md
          grep -F '48.52%' paper/manuscript/Q2_ENGLISH_MANUSCRIPT_V2.md
          grep -F '0.864%' paper/manuscript/Q2_ENGLISH_MANUSCRIPT_V2.md
          grep -F '2.162%' paper/manuscript/Q2_ENGLISH_MANUSCRIPT_V2.md
          grep -F '95.04%' paper/manuscript/Q2_ENGLISH_MANUSCRIPT_V2.md
          grep -F 'one physical cell instrumented with a fixed dual-FBG' paper/manuscript/Q2_ENGLISH_MANUSCRIPT_V2.md
          grep -F 'no formal 95% coverage guarantee' paper/manuscript/Q2_ENGLISH_MANUSCRIPT_V2.md
          grep -F 'range from 29 to 65 epochs' paper/manuscript/Q2_ENGLISH_MANUSCRIPT_V2.md
          grep -F 'reviewer-risk safeguards: **PASS**' paper/manuscript/Q2_ENGLISH_MANUSCRIPT_V2_ASSEMBLY_REPORT.md
          grep -F 'training-protocol consistency: **PASS**' paper/manuscript/Q2_ENGLISH_MANUSCRIPT_V2_ASSEMBLY_REPORT.md
          grep -F 'table/figure numbering: **PASS**' paper/manuscript/Q2_ENGLISH_MANUSCRIPT_V2_ASSEMBLY_REPORT.md
          grep -F 'data/code availability sections: **PASS**' paper/manuscript/Q2_ENGLISH_MANUSCRIPT_V2_ASSEMBLY_REPORT.md
          grep -F 'final abstract length: **250 words**' paper/manuscript/Q2_ENGLISH_MANUSCRIPT_V2_ASSEMBLY_REPORT.md
      - name: Persist canonical assembled manuscript
        run: |
          git config user.name "RuiSearch"
          git config user.email "90998393+Ustinian1722@users.noreply.github.com"
          git add paper/manuscript/Q2_ENGLISH_MANUSCRIPT_V2.md paper/manuscript/Q2_ENGLISH_MANUSCRIPT_V2_ASSEMBLY_REPORT.md
          if git diff --cached --quiet; then
            echo "Canonical manuscript already up to date"
          else
            git commit -m "paper: persist canonical English manuscript V2 [skip ci]"
            git push origin HEAD:research/eo-gated-mamba-paper
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: q2-english-manuscript-v2
          path: paper/manuscript/**
          retention-days: 90
