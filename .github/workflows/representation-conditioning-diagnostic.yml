name: FBG representation conditioning diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "analysis/run_representation_conditioning_diagnostic.py"
      - ".github/workflows/representation-conditioning-diagnostic.yml"
      - "SiC-18.zip"

permissions:
  contents: read

concurrency:
  group: fiberoptic-conditioning-diagnostic
  cancel-in-progress: true

jobs:
  whitening:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage and verify SiC-18 archive
        shell: bash
        run: |
          test -f SiC-18.zip
          mkdir -p data/raw data/extracted/SiC-18
          cp SiC-18.zip data/raw/SiC-18.zip
          echo "8ebc43eb6d205dfc573dae853d63efcd1a00169be9d2f1e512b9220ea7799bc4  data/raw/SiC-18.zip" | sha256sum -c -
          unzip -q data/raw/SiC-18.zip -d data/extracted/SiC-18

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.2 openpyxl==3.1.5 scikit-learn==1.8.0
          python -m pip install --disable-pip-version-check torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Run whitening diagnostic
        run: |
          python analysis/run_representation_conditioning_diagnostic.py \
            --data data/extracted/SiC-18 \
            --out-dir results/representation_conditioning \
            --window 64 \
            --train-stride 4 \
            --test-stride 1 \
            --epochs 6 \
            --batch-size 256 \
            --seed 42

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          if [ -f results/representation_conditioning/whitening_results.csv ]; then
            echo "## FBG representation conditioning diagnostic" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            python -c 'import pandas as pd; print(pd.read_csv("results/representation_conditioning/representation_condition_numbers.csv").to_string(index=False)); print(); d=pd.read_csv("results/representation_conditioning/whitening_results.csv"); print(d.sort_values(["split","MAE"]).to_string(index=False))' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fbg-representation-conditioning
          path: results/representation_conditioning/**
          if-no-files-found: warn
          retention-days: 30
