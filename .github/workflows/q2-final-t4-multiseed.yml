name: Q2 final T4 multiseed benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/START_Q2_FINAL_T4"

permissions:
  contents: read

concurrency:
  group: fiberoptic-q2-final-t4
  cancel-in-progress: false

jobs:
  seed:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete frozen design and data
        shell: bash
        run: |
          test -f config/Q2_REPRESENTATION_FREEZE.md
          test -f config/q2_frozen_epoch_plan.csv
          test -f config/q2_feature_freeze.json
          test -f config/q2_cqr_freeze.json
          test -f config/START_Q2_FINAL_T4
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          feature = json.loads(Path("config/q2_feature_freeze.json").read_text())
          cqr = json.loads(Path("config/q2_cqr_freeze.json").read_text())
          latch = json.loads(Path("config/START_Q2_FINAL_T4").read_text())

          if feature.get("frozen_model") != "IUW-TCN":
              raise SystemExit("Formal T4 requires frozen model IUW-TCN")
          if feature.get("feature_mode") != "raw_w":
              raise SystemExit("Formal T4 requires frozen feature mode raw_w")
          if feature.get("delta_t_decision") != "DROP":
              raise SystemExit("Formal T4 expects preregistered delta-t decision DROP")
          if cqr.get("frozen_model") != "IUW-TCN" or cqr.get("feature_mode") != "raw_w":
              raise SystemExit("CQR freeze is inconsistent with final point model")
          if cqr.get("decision") not in {"KEEP", "DROP"}:
              raise SystemExit("CQR KEEP/DROP decision is not frozen")
          if latch.get("release") is not True:
              raise SystemExit("Final T4 latch requires release=true")
          if latch.get("frozen_model") != "IUW-TCN" or latch.get("feature_mode") != "raw_w":
              raise SystemExit("Final T4 latch does not match frozen model/feature mode")
          if latch.get("delta_t_decision") != "DROP" or latch.get("cqr_decision") != cqr.get("decision"):
              raise SystemExit("Final T4 latch does not match frozen design decisions")
          if latch.get("publication_seeds") != [0, 1, 2, 3, 4]:
              raise SystemExit("Final T4 publication seeds must be exactly [0,1,2,3,4]")

          with open("config/q2_frozen_epoch_plan.csv", newline="") as f:
              rows = list(csv.DictReader(f))
          if len(rows) != 12:
              raise SystemExit(f"Expected 12 frozen epoch rows, found {len(rows)}")
          if {r["model"] for r in rows} != {"IUW-TCN"}:
              raise SystemExit("Frozen epoch plan contains a non-IUW-TCN model")
          if not all(str(r.get("source_only", "")).lower() == "true" for r in rows):
              raise SystemExit("Every frozen epoch row must be source-only")
          if any(str(r.get("target_metrics_computed", "")).lower() == "true" for r in rows):
              raise SystemExit("Frozen epoch plan must not use target metrics")
          PY
          echo "8ebc43eb6d205dfc573dae853d63efcd1a00169be9d2f1e512b9220ea7799bc4  SiC-18.zip" | sha256sum -c -
          mkdir -p data/extracted/SiC-18
          unzip -q SiC-18.zip -d data/extracted/SiC-18
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.2 openpyxl==3.1.5 scipy==1.17.1 scikit-learn==1.8.0
          python -m pip install --disable-pip-version-check torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run frozen IUW-TCN T4
        run: |
          python analysis/run_q2_frozen_t4.py \
            --data data/extracted/SiC-18 \
            --epoch-plan config/q2_frozen_epoch_plan.csv \
            --out-dir results/q2_final_t4/seed_${{ matrix.seed }} \
            --seed ${{ matrix.seed }} \
            --window 64 --train-stride 4 --test-stride 1 --batch-size 256 \
            --noise-pm 0.5 1.0 2.0 --noise-draws 5
      - name: Upload seed result
        uses: actions/upload-artifact@v4
        with:
          name: q2-t4-seed-${{ matrix.seed }}
          path: results/q2_final_t4/seed_${{ matrix.seed }}/**
          retention-days: 60

  aggregate:
    needs: seed
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: q2-t4-seed-*
          path: collected
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.2
      - name: Aggregate frozen single-model statistics
        run: |
          python analysis/aggregate_q2_t4_multiseed.py \
            --input-root collected \
            --out-dir results/q2_final_t4_summary \
            --bootstrap 20000
      - name: Publish summary
        shell: bash
        run: |
          echo "## Q2 final frozen IUW-TCN T4 across-seed summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat results/q2_final_t4_summary/across_seed_summary.csv >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          cat results/q2_final_t4_summary/seed_cluster_bootstrap.csv >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          cat results/q2_final_t4_summary/fbg_noise_across_seed_summary.csv >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: q2-final-t4-summary
          path: results/q2_final_t4_summary/**
          retention-days: 90
