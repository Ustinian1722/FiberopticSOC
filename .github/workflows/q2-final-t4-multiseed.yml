name: Q2 final T4 multiseed benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fiberoptic-q2-final-t4
  cancel-in-progress: false

jobs:
  seed:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen plan and data
        run: |
          test -f config/q2_frozen_epoch_plan.csv
          echo "8ebc43eb6d205dfc573dae853d63efcd1a00169be9d2f1e512b9220ea7799bc4  SiC-18.zip" | sha256sum -c -
          mkdir -p data/extracted/SiC-18
          unzip -q SiC-18.zip -d data/extracted/SiC-18
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.2 openpyxl==3.1.5 scipy==1.17.1 scikit-learn==1.8.0
          python -m pip install --disable-pip-version-check torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run frozen T4
        run: |
          python analysis/run_q2_frozen_t4.py \
            --data data/extracted/SiC-18 \
            --epoch-plan config/q2_frozen_epoch_plan.csv \
            --out-dir results/q2_final_t4/seed_${{ matrix.seed }} \
            --seed ${{ matrix.seed }} \
            --window 64 --train-stride 4 --test-stride 1 --batch-size 256
      - name: Upload seed result
        uses: actions/upload-artifact@v4
        with:
          name: q2-t4-seed-${{ matrix.seed }}
          path: results/q2_final_t4/seed_${{ matrix.seed }}/**
          retention-days: 60

  aggregate:
    needs: seed
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: q2-t4-seed-*
          path: collected
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.2 scipy==1.17.1
      - name: Aggregate paired statistics
        run: |
          python analysis/aggregate_q2_t4_multiseed.py \
            --input-root collected \
            --out-dir results/q2_final_t4_summary
      - name: Publish summary
        shell: bash
        run: |
          echo "## Q2 final T4 across-seed summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat results/q2_final_t4_summary/across_seed_summary.csv >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          cat results/q2_final_t4_summary/paired_statistics.csv >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: q2-final-t4-summary
          path: results/q2_final_t4_summary/**
          retention-days: 90
