name: Nested train-only epoch selection audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'analysis/run_nested_epoch_selection.py'
      - '.github/workflows/nested-epoch-selection.yml'

jobs:
  split-run:
    strategy:
      fail-fast: false
      matrix:
        train_rate: [1C, 2C]
        held_out: [HWFET, LA92, NEDC, NYCC, US06, WLTC]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
      - name: Stage and verify SiC-18 archive
        shell: bash
        run: |
          test -f SiC-18.zip
          mkdir -p data/raw data/extracted/SiC-18
          cp SiC-18.zip data/raw/SiC-18.zip
          echo "8ebc43eb6d205dfc573dae853d63efcd1a00169be9d2f1e512b9220ea7799bc4  data/raw/SiC-18.zip" | sha256sum -c -
          unzip -q data/raw/SiC-18.zip -d data/extracted/SiC-18
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.2 openpyxl==3.1.5 scipy==1.17.1 scikit-learn==1.8.0
          python -m pip install --disable-pip-version-check torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run nested epoch selection
        run: |
          python analysis/run_nested_epoch_selection.py \
            --data data/extracted/SiC-18 \
            --out-dir results/nested_epoch/${{ matrix.train_rate }}_${{ matrix.held_out }} \
            --train-rate ${{ matrix.train_rate }} \
            --held-out-profile ${{ matrix.held_out }} \
            --window 64 --train-stride 4 --val-stride 1 --test-stride 1 \
            --max-epochs 15 --batch-size 256 --seed 42
      - uses: actions/upload-artifact@v4
        with:
          name: nested-epoch-${{ matrix.train_rate }}-${{ matrix.held_out }}
          path: results/nested_epoch/${{ matrix.train_rate }}_${{ matrix.held_out }}/**
          retention-days: 30

  aggregate:
    needs: split-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: nested-epoch-*
          path: downloaded
          merge-multiple: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pandas==2.3.2 numpy==2.3.2
      - name: Aggregate audit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          root=Path('downloaded')
          tests=pd.concat([pd.read_csv(p) for p in root.rglob('test_metrics.csv')],ignore_index=True)
          epochs=pd.concat([pd.read_csv(p) for p in root.rglob('selected_epochs.csv')],ignore_index=True)
          out=Path('results/nested_epoch_aggregate'); out.mkdir(parents=True,exist_ok=True)
          tests.to_csv(out/'all_test_metrics.csv',index=False)
          epochs.to_csv(out/'all_selected_epochs.csv',index=False)
          summary=tests.groupby(['direction','model'],as_index=False).agg(MAE_mean=('MAE','mean'),MAE_std=('MAE','std'),RMSE_mean=('RMSE','mean'),R2_mean=('R2','mean'),Q95_AE_mean=('Q95_AE','mean'))
          summary.to_csv(out/'summary.csv',index=False)
          epoch_summary=epochs.groupby(['direction','model'],as_index=False).agg(selected_epoch_mean=('selected_epoch','mean'),selected_epoch_min=('selected_epoch','min'),selected_epoch_max=('selected_epoch','max'),hit_max_count=('hit_max_epoch','sum'))
          epoch_summary.to_csv(out/'epoch_summary.csv',index=False)
          print('=== Test summary ==='); print(summary.sort_values(['direction','MAE_mean']).to_string(index=False))
          print('\n=== Epoch selection ==='); print(epoch_summary.to_string(index=False))
          PY
      - name: Publish summary
        shell: bash
        run: |
          echo "## Nested train-only epoch-selection audit" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          python -c 'import pandas as pd; print(pd.read_csv("results/nested_epoch_aggregate/summary.csv").sort_values(["direction","MAE_mean"]).to_string(index=False)); print(); print(pd.read_csv("results/nested_epoch_aggregate/epoch_summary.csv").to_string(index=False))' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: nested-epoch-selection-summary
          path: results/nested_epoch_aggregate/**
          retention-days: 30
