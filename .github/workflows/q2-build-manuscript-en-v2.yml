name: Build Q2 English manuscript V2

on:
  push:
    branches: [research/eo-gated-mamba-paper]
    paths:
      - "analysis/build_q2_manuscript_en_v2.py"
      - "docs/Q2_MANUSCRIPT_EN_V1.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/eo-gated-mamba-paper
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build V2 manuscript
        run: python analysis/build_q2_manuscript_en_v2.py
      - name: Verify reviewer-risk patches
        run: |
          grep -F "one physical cell instrumented with a fixed dual-FBG" docs/Q2_MANUSCRIPT_EN_V2.md
          grep -F "no formal 95% coverage guarantee" docs/Q2_MANUSCRIPT_EN_V2.md
          grep -F "Bai" docs/Q2_MANUSCRIPT_EN_V2.md
          grep -F "Distribution-Free Predictive Inference" docs/Q2_MANUSCRIPT_EN_V2.md
      - name: Commit generated manuscript
        run: |
          git config user.name "RuiSearch"
          git config user.email "90998393+Ustinian1722@users.noreply.github.com"
          git add docs/Q2_MANUSCRIPT_EN_V2.md
          if git diff --cached --quiet; then
            echo "No manuscript changes to commit"
          else
            git commit -m "paper: generate reviewer-hardened English manuscript V2 [skip ci]"
            git push origin HEAD:research/eo-gated-mamba-paper
          fi
