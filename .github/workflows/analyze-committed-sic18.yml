name: Analyze committed SiC-18 archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "SiC-18.zip"
      - "data/raw/SiC-18.zip"
      - ".github/workflows/analyze-committed-sic18.yml"
      - "scripts/**"
      - "analysis/**"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage and verify audited raw archive
        shell: bash
        run: |
          mkdir -p data/raw
          if [ -f data/raw/SiC-18.zip ]; then
            SRC="data/raw/SiC-18.zip"
          elif [ -f SiC-18.zip ]; then
            SRC="SiC-18.zip"
            cp SiC-18.zip data/raw/SiC-18.zip
          else
            echo "SiC-18.zip not found in repository root or data/raw" >&2
            exit 1
          fi
          echo "Using archive: $SRC"
          echo "8ebc43eb6d205dfc573dae853d63efcd1a00169be9d2f1e512b9220ea7799bc4  data/raw/SiC-18.zip" | sha256sum -c -

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check scikit-learn==1.8.0

      - name: Run structural and leakage audit
        run: |
          python scripts/analyze_dataset.py \
            --raw data/raw \
            --extracted data/extracted \
            --out results/committed_raw_audit

      - name: Run leakage-safe cross-condition baseline
        run: |
          python analysis/run_initial_baseline.py \
            --data data/extracted/SiC-18/SiC-18 \
            --out results/committed_raw_audit/baseline_results.csv

      - name: Add audit report to job summary
        if: always()
        shell: bash
        run: |
          if [ -f results/committed_raw_audit/analysis_report.md ]; then
            cat results/committed_raw_audit/analysis_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload reproducible results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sic18-reproducible-audit
          path: results/committed_raw_audit/**
          if-no-files-found: warn
          retention-days: 30
