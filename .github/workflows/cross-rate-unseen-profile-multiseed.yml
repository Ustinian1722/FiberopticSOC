name: Cross-rate unseen-profile multi-seed benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cross-rate-unseen-profile-multiseed.yml"
      - "analysis/aggregate_cross_rate_multiseed.py"

permissions:
  contents: read

concurrency:
  group: fiberoptic-cross-rate-unseen-profile-multiseed
  cancel-in-progress: true

jobs:
  seed-run:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        seed: [0, 1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage and verify SiC-18 archive
        shell: bash
        run: |
          test -f SiC-18.zip
          mkdir -p data/raw data/extracted/SiC-18
          cp SiC-18.zip data/raw/SiC-18.zip
          echo "8ebc43eb6d205dfc573dae853d63efcd1a00169be9d2f1e512b9220ea7799bc4  data/raw/SiC-18.zip" | sha256sum -c -
          unzip -q data/raw/SiC-18.zip -d data/extracted/SiC-18

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.2 openpyxl==3.1.5 scipy==1.17.1 scikit-learn==1.8.0
          python -m pip install --disable-pip-version-check torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Run seed ${{ matrix.seed }}
        run: |
          python analysis/run_cross_rate_unseen_profile.py \
            --data data/extracted/SiC-18 \
            --out-dir results/multiseed/seed_${{ matrix.seed }} \
            --window 64 \
            --train-stride 4 \
            --test-stride 1 \
            --epochs 6 \
            --batch-size 256 \
            --envelope-quantile 0.005 \
            --seed ${{ matrix.seed }}

      - name: Upload compact seed metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-rate-seed-${{ matrix.seed }}
          path: |
            results/multiseed/seed_${{ matrix.seed }}/split_metrics.csv
            results/multiseed/seed_${{ matrix.seed }}/aggregate_summary.csv
            results/multiseed/seed_${{ matrix.seed }}/gate_summary.csv
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: seed-run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download seed metrics
        uses: actions/download-artifact@v4
        with:
          pattern: cross-rate-seed-*
          path: downloaded
          merge-multiple: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install aggregation dependency
        run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.2

      - name: Aggregate five seeds
        run: |
          python analysis/aggregate_cross_rate_multiseed.py \
            --input-root downloaded \
            --out-dir results/multiseed_aggregate

      - name: Publish multi-seed summary
        shell: bash
        run: |
          echo "## Cross-rate + unseen-profile five-seed summary" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          python -c 'import pandas as pd; a=pd.read_csv("results/multiseed_aggregate/across_seed_summary.csv"); print(a.sort_values(["direction","MAE_mean"]).to_string(index=False)); print(); w=pd.read_csv("results/multiseed_aggregate/winner_counts.csv"); print(w.sort_values(["direction","wins"],ascending=[True,False]).to_string(index=False))' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregated metrics
        uses: actions/upload-artifact@v4
        with:
          name: cross-rate-unseen-profile-multiseed-summary
          path: results/multiseed_aggregate/**
          if-no-files-found: error
          retention-days: 30
