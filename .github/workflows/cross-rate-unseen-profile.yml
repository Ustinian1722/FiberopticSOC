name: Cross-rate unseen-profile benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "analysis/run_cross_rate_unseen_profile.py"
      - ".github/workflows/cross-rate-unseen-profile.yml"
      - "SiC-18.zip"

permissions:
  contents: read

concurrency:
  group: fiberoptic-cross-rate-unseen-profile
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage and verify SiC-18 archive
        shell: bash
        run: |
          test -f SiC-18.zip
          mkdir -p data/raw data/extracted/SiC-18
          cp SiC-18.zip data/raw/SiC-18.zip
          echo "8ebc43eb6d205dfc573dae853d63efcd1a00169be9d2f1e512b9220ea7799bc4  data/raw/SiC-18.zip" | sha256sum -c -
          unzip -q data/raw/SiC-18.zip -d data/extracted/SiC-18

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.2 openpyxl==3.1.5 scipy==1.17.1 scikit-learn==1.8.0
          python -m pip install --disable-pip-version-check torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Run combined cross-rate and unseen-profile benchmark
        run: |
          python analysis/run_cross_rate_unseen_profile.py \
            --data data/extracted/SiC-18 \
            --out-dir results/cross_rate_unseen_profile \
            --window 64 \
            --train-stride 4 \
            --test-stride 1 \
            --epochs 6 \
            --batch-size 256 \
            --envelope-quantile 0.005 \
            --seed 42

      - name: Publish summary
        if: always()
        shell: bash
        run: |
          if [ -f results/cross_rate_unseen_profile/aggregate_summary.csv ]; then
            echo "## Cross-rate + unseen-profile benchmark" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            python -c 'import pandas as pd; a=pd.read_csv("results/cross_rate_unseen_profile/aggregate_summary.csv"); print(a.sort_values(["direction","MAE_mean"]).to_string(index=False)); print(); g=pd.read_csv("results/cross_rate_unseen_profile/gate_summary.csv"); print(g.to_string(index=False))' >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-rate-unseen-profile
          path: results/cross_rate_unseen_profile/**
          if-no-files-found: warn
          retention-days: 30
