name: Q2 protocol audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "analysis/q2_protocols.py"
      - "analysis/run_q2_protocol_audit.py"
      - ".github/workflows/q2-protocol-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Stage and verify SiC-18
        run: |
          mkdir -p data/extracted/SiC-18
          echo "8ebc43eb6d205dfc573dae853d63efcd1a00169be9d2f1e512b9220ea7799bc4  SiC-18.zip" | sha256sum -c -
          unzip -q SiC-18.zip -d data/extracted/SiC-18
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.2 openpyxl==3.1.5 scikit-learn==1.8.0 torch==2.8.0 --extra-index-url https://download.pytorch.org/whl/cpu
      - name: Audit T1-T4 builders
        run: python analysis/run_q2_protocol_audit.py --data data/extracted/SiC-18 --out-dir results/q2_protocol_audit --window 64
      - uses: actions/upload-artifact@v4
        with:
          name: q2-protocol-audit
          path: results/q2_protocol_audit/**
          retention-days: 30
