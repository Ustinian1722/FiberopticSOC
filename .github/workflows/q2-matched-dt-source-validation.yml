name: Q2 source-only matched delta-t gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/q2_matched_dt_plan.json"

permissions:
  contents: read

concurrency:
  group: fiberoptic-q2-matched-dt
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        name: Validate frozen point model and epoch plan
        shell: bash
        run: |
          test -f config/Q2_REPRESENTATION_FREEZE.md
          test -f config/Q2_MATCHED_DT_PROTOCOL.md
          test -f config/q2_frozen_epoch_plan.csv
          test -f config/q2_matched_dt_plan.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import csv
          import json
          from pathlib import Path

          profiles = {"HWFET", "LA92", "NEDC", "NYCC", "US06", "WLTC"}
          expected = {
              ("1C_to_2C", p) for p in profiles
          } | {
              ("2C_to_1C", p) for p in profiles
          }

          latch = json.loads(Path("config/q2_matched_dt_plan.json").read_text())
          if latch.get("release") is not True:
              raise SystemExit("Matched-dt latch must explicitly set release=true")
          if latch.get("frozen_model") != "IUW-TCN":
              raise SystemExit("Matched-dt latch must name frozen model IUW-TCN")
          if latch.get("protocol") != "source-only-12fold-matched-dt-v1":
              raise SystemExit("Unexpected matched-dt protocol identifier")

          with open("config/q2_frozen_epoch_plan.csv", newline="") as f:
              rows = list(csv.DictReader(f))
          if len(rows) != 12:
              raise SystemExit(f"Expected 12 frozen epoch rows, found {len(rows)}")

          seen = set()
          include = []
          for r in rows:
              direction = r["direction"]
              profile = r["held_out_profile"]
              model = r["model"]
              epoch = int(float(r["selected_epoch"]))
              key = (direction, profile)
              if key not in expected:
                  raise SystemExit(f"Unexpected epoch-plan key: {key}")
              if key in seen:
                  raise SystemExit(f"Duplicate epoch-plan key: {key}")
              if model != "IUW-TCN":
                  raise SystemExit(f"Epoch plan contains non-frozen model: {model}")
              if epoch < 1 or epoch > 200:
                  raise SystemExit(f"Invalid selected epoch {epoch} for {key}")
              seen.add(key)
              train_rate = "1C" if direction == "1C_to_2C" else "2C"
              include.append({
                  "train_rate": train_rate,
                  "val_profile": profile,
                  "epochs": epoch,
              })

          if seen != expected:
              raise SystemExit(f"Frozen epoch plan incomplete; missing={sorted(expected-seen)}")
          include.sort(key=lambda x: (x["train_rate"], x["val_profile"]))
          print("matrix=" + json.dumps({"include": include}, separators=(",", ":")))
          PY

  validate:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract SiC-18
        run: |
          echo "8ebc43eb6d205dfc573dae853d63efcd1a00169be9d2f1e512b9220ea7799bc4  SiC-18.zip" | sha256sum -c -
          mkdir -p data/extracted/SiC-18
          unzip -q SiC-18.zip -d data/extracted/SiC-18
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.2 openpyxl==3.1.5 scipy==1.17.1 scikit-learn==1.8.0
          python -m pip install --disable-pip-version-check torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run matched source validation
        run: |
          python analysis/run_q2_matched_dt_source_validation.py \
            --data data/extracted/SiC-18 \
            --out-dir results/q2_matched_dt/${{ matrix.train_rate }}_${{ matrix.val_profile }} \
            --train-rate "${{ matrix.train_rate }}" \
            --val-profile "${{ matrix.val_profile }}" \
            --epochs ${{ matrix.epochs }} \
            --window 64 --train-stride 4 --val-stride 1 --batch-size 256 \
            --lr 0.001 --seed 42
      - uses: actions/upload-artifact@v4
        with:
          name: q2-matched-dt-${{ matrix.train_rate }}-${{ matrix.val_profile }}
          path: results/q2_matched_dt/${{ matrix.train_rate }}_${{ matrix.val_profile }}/**
          retention-days: 45

  aggregate:
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: q2-matched-dt-*
          path: collected
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check numpy==2.3.2 pandas==2.3.2
      - name: Apply preregistered keep-drop rule
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd

          paired_files = sorted(Path("collected").rglob("paired_delta.csv"))
          arm_files = sorted(Path("collected").rglob("arm_metrics.csv"))
          if len(paired_files) != 12 or len(arm_files) != 12:
              raise SystemExit(
                  f"Expected 12 paired and 12 arm files, got {len(paired_files)} and {len(arm_files)}"
              )

          paired = pd.concat([pd.read_csv(p) for p in paired_files], ignore_index=True)
          arms = pd.concat([pd.read_csv(p) for p in arm_files], ignore_index=True)
          if paired.duplicated(["train_rate", "val_profile"]).any():
              raise SystemExit("Duplicate source-validation fold")
          if set(paired.train_rate) != {"1C", "2C"} or len(paired) != 12:
              raise SystemExit("Incomplete matched-dt fold set")

          mean_delta = float(paired.delta_MAE_dt_minus_no_dt.mean())
          median_delta = float(paired.delta_MAE_dt_minus_no_dt.median())
          wins = int(paired.dt_wins_MAE.astype(bool).sum())
          q95_delta = float(paired.delta_Q95_AE_dt_minus_no_dt.mean())
          rate = paired.groupby("train_rate", as_index=False).agg(
              mean_delta_MAE=("delta_MAE_dt_minus_no_dt", "mean"),
              median_delta_MAE=("delta_MAE_dt_minus_no_dt", "median"),
              wins=("dt_wins_MAE", "sum"),
              mean_delta_Q95_AE=("delta_Q95_AE_dt_minus_no_dt", "mean"),
          )

          c1 = mean_delta < 0.0
          c2 = median_delta < 0.0
          c3 = wins >= 8
          c4 = bool((rate.mean_delta_MAE < 0.0).all())
          c5 = q95_delta <= 0.0
          keep = bool(c1 and c2 and c3 and c4 and c5)

          decision = pd.DataFrame([{
              "frozen_model": "IUW-TCN",
              "candidate_feature": "causal_log1p_delta_t",
              "n_source_validation_folds": 12,
              "mean_delta_MAE_dt_minus_no_dt": mean_delta,
              "median_delta_MAE_dt_minus_no_dt": median_delta,
              "dt_MAE_wins": wins,
              "mean_delta_Q95_AE_dt_minus_no_dt": q95_delta,
              "criterion_mean_MAE_improves": c1,
              "criterion_median_MAE_improves": c2,
              "criterion_at_least_8_of_12_MAE_wins": c3,
              "criterion_both_rates_mean_MAE_improve": c4,
              "criterion_overall_Q95_not_worse": c5,
              "decision": "KEEP" if keep else "DROP",
              "target_metrics_used_for_decision": False,
          }])

          Path("summary").mkdir(exist_ok=True)
          paired.sort_values(["train_rate", "val_profile"]).to_csv("summary/paired_source_validation.csv", index=False)
          arms.sort_values(["train_rate", "val_profile", "model"]).to_csv("summary/arm_metrics.csv", index=False)
          rate.to_csv("summary/rate_summary.csv", index=False)
          decision.to_csv("summary/dt_decision.csv", index=False)
          print(decision.to_string(index=False))
          print(rate.to_string(index=False))
          PY
      - name: Publish summary
        shell: bash
        run: |
          echo "## Q2 matched causal delta-t source-only decision" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat summary/dt_decision.csv >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          cat summary/rate_summary.csv >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: q2-matched-dt-source-validation-summary
          path: summary/**
          retention-days: 60
